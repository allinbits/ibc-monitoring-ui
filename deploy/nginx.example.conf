# One origin for the console and the API: no CORS needed. Put this server
# behind your access control (SSO or a private network); see ibc-monitoring's
# docs/design.md §3.4 and §10.2.
server {
    listen 80;
    server_name monitor.example;

    root /srv/ibc-monitoring-ui/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Client-side routes fall back to the app.
    location / {
        try_files $uri /index.html;
    }
}
